<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>

		<title>reveal.js</title>

		<link rel="stylesheet" href="dist/reset.css" />
		<link rel="stylesheet" href="dist/reveal.css" />
		<link rel="stylesheet" href="dist/theme/blood.css" />

		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="dist/plugin/highlight/monokai.css" />
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<section data-background-iframe="http://jake.homeassistant:8123/energy/electricity"
						data-background-interactive data-preload>
				<h2>Iframe</h2>
				</section>
				<section>
					HA Test
					<p>
						<iframe width="1800" height="600" data-src="http://jake.homeassistant:8123/energy/electricity" data-preload></iframe>
					</p>
				</section>
				<!-- <section>
					Frigate Test
					<p>
						<iframe width="1800" height="600" data-src="http://frigate.localhost" data-preload></iframe>
					</p>
				</section> -->
				<section>
					Frigate Test (Direct)
					<p>
						<iframe width="1800" height="600" data-src="http://192.168.0.233:8971" data-preload></iframe>
					</p>
				</section>
				<section>
					Jellyfin Test
					<p>
						<iframe width="1800" height="600" data-src="http://ubuntu.jake:8096/web/#/home" data-preload></iframe>
					</p>
				</section>
				<section>
					TubeArchivist Test
					<p>
						<iframe width="1800" height="600" data-src="http://ubuntu.jake:8000/" data-preload></iframe>
					</p>
				</section>
			</div>
		</div>

		<script src="dist/reveal.js"></script>
		<script src="dist/plugin/notes.js"></script>
		<script src="dist/plugin/markdown.js"></script>
		<script src="dist/plugin/highlight.js"></script>
		<script>
			// More info about initialization & config:
			// - https://revealjs.com/initialization/
			// - https://revealjs.com/config/
			Reveal.initialize({
				hash: true,

				// Learn about plugins: https://revealjs.com/plugins/
				plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
			});
		</script>
	</body>
</html>
